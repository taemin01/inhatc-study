<!DOCTYPE html>
<html>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
<body>

<div ng-app="" ng-init="names=[
  {name:'강감찬',country:'서울'},
  {name:'이순신',country:'부산'},
  {name:'홍길동',country:'대구'}]">
<p>ng-repeat로 object 반복하기</p>
<ul>
  <li ng-repeat="x in names">
  {{ x.name + ', ' + x.country }}</li>
</ul>
</div>

</body>
</html>
